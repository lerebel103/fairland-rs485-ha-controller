name: CI

on:
  push:
    branches: ['**']
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - uses: actions/setup-python@v7
        with:
          python-version: '3.14'
      - run: uv sync --frozen --group dev
      - run: uv run ruff check app/ tests/ scripts/
      - run: uv run ruff format --check app/ tests/ scripts/
      - name: Modbus map doc is up to date
        run: uv run python scripts/render_modbus_map.py --check

  test:
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - uses: actions/setup-python@v7
        with:
          python-version: '3.14'
      - run: uv sync --frozen --group dev
      - run: uv run pytest tests/ -v --tb=short --cov=app --cov-report=term-missing
